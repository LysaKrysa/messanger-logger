<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>Sign in · Messenger workspace</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body class="login-body"><main class="login-panel"><div class="brand-icon large">m<span>↗</span></div><div class="eyebrow">YOUR PRIVATE WORKSPACE</div><h1>Welcome back.</h1><p class="muted">Manage accounts and keep every connection in view.</p>
{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">Administrator password</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required autofocus><button class="button primary full">Sign in <span>↗</span></button></form><p class="login-note">Restricted to the server administrator.</p></main></body></html>
